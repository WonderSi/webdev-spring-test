spring:
  profiles:
    active: db
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:/db/migration
server:
  port: ${SERVER_PORT:8080}